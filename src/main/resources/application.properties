# ===========================
# PERFIL ATIVO
# ===========================
# Use "prod" para produ\u00E7\u00E3o ou "local" para desenvolvimento no .env
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Porta da aplica\u00E7\u00E3o
server.port=8080

# ===========================
# GOOGLE OAUTH2
# ===========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:3000/login/oauth2/code/google

# Padr\u00F5es do Spring para Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# ===========================
# UPLOAD DE ARQUIVOS
# ===========================
file.upload-dir=./uploads/

# MAIL - use defaults seguros para desenvolvimento para evitar erro de placeholder n\u00E3o resolvido
# Em produ\u00E7\u00E3o, forne\u00E7a as vari\u00E1veis de ambiente MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, etc.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=false

