##Fluxo CI

name: Spring Boot CI Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write


    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait for Postgres and Redis to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          /usr/bin/env bash -c 'until PGPASSWORD=$POSTGRES_PASSWORD pg_isready --dbname=$POSTGRES_DB --username=$POSTGRES_USER --host=localhost; do sleep 1; done'
          echo "Waiting for Redis..."
          /usr/bin/env bash -c 'while ! nc -z localhost 6379; do sleep 1; done'
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb

      - name: Compile, Test and Package
        run: mvn -B clean install

      - name: Generate JaCoCo report
        run: mvn verify

      - name: Upload Jacoco coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1.9.1
        with:
          name: Maven Test Results
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-empty: false
